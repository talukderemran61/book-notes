services:
  # ------- Database --------
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: booknotes
    volumes:
      # Persistent storage – data survives container restarts
      - postgres_data:/var/lib/postgresql/data
      # Automatically run local(queries.sql) SQL script to create tables & seed data
      - ./queries.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"     # Optional – allows pgAdmin connection from host
    
  # ------- Application ---------
  app:
    build: .            # uses the Dockerfile in this directory
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # The connection string points to the 'db' service (hostname = service name)
      DATABASE_URL: postgresql://postgres:secret@db:5432/booknotes
      PORT: "3000"
    depends_on:
      - db              # Start database before the app

volumes:
  postgres_data:         # declare the named volume